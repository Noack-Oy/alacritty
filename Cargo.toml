[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "0.9.2"
toml_edit = "0.23.1"

# crossfont 0.8.1 as published, plus one change in its DirectWrite backend: a font
# that carries bitmap strikes (EBLC) is rasterised aliased, from a 1x1 texture,
# instead of through the ClearType 3x1 texture -- whose three subpixel coverages
# alacritty blends per channel, colouring every edge even on a pixel-exact font.
# Terminus (TTF) is the font this is for. See vendor/crossfont/src/directwrite/mod.rs.
[patch.crates-io]
crossfont = { path = "vendor/crossfont" }
